  <title>Melomaniac — Back soon</title>
  <meta name="description" content="We're tuning up the site. Back soon.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #000000;
      --fg: #f3efe6;
      --muted: #a39e94;
      --accent: #ff5a36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 34rem; }
    .bars {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 40px;
      margin-bottom: 2rem;
    }
    .bars span {
      width: 6px;
      background: var(--accent);
      border-radius: 3px;
      animation: eq 1.2s ease-in-out infinite;
    }
    .bars span:nth-child(1) { animation-delay: -0.9s; }
    .bars span:nth-child(2) { animation-delay: -0.3s; }
    .bars span:nth-child(3) { animation-delay: -0.6s; }
    .bars span:nth-child(4) { animation-delay: -0.1s; }
    .bars span:nth-child(5) { animation-delay: -0.75s; }
    @keyframes eq {
      0%, 100% { height: 20%; }
      50% { height: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bars span { animation: none; height: 60%; }
    }
    .logo {
      display: block;
      width: min(100%, 26rem);
      height: auto;
      margin: 0 auto 1.75rem;
    }
    p {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--muted);
    }
    a {
      color: var(--fg);
      text-decoration-color: var(--accent);
      text-underline-offset: 3px;
    }
    .contact { margin-top: 2rem; font-size: 0.95rem; }
  </style>
</head>
